name = "lpp-hospitality-portal"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[observability]
enabled = true

[vars]
NEXT_PUBLIC_SITE_URL    = "https://portal.lpphospitality.com"
SITE_URL                = "https://portal.lpphospitality.com"
R2_BUCKET               = "lpp-portal-uploads"
R2_PUBLIC_URL           = "https://uploads.lpphospitality.com"
# MAKE_WEBHOOK_URL_* moved to encrypted Cloudflare secrets — plaintext [vars] are
# committed to git and were being scraped from commits. Names now set as secrets:
# MAKE_WEBHOOK_URL_CSV, _PDF, _EXTRACTION, _MENU_ENGINEERING, _EXCEL
# Verify with: wrangler secret list
# Secrets (JWT_SECRET, NOTION_API_KEY, RESEND_API_KEY, INTERNAL_API_SECRET,
#          MAKE_WEBHOOK_URL, MAKE_WEBHOOK_URL_*)
# → set via dashboard or: wrangler secret put <NAME>

[[r2_buckets]]
binding = "R2"
bucket_name = "lpp-portal-uploads"
